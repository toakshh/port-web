<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Locked — Tripo Converter</title>
<!-- Deliberately self-contained: this page is served before authentication,
     so it must not pull anything else out of the gated public/ directory. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0f17; color: #e6edf7;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: min(380px, calc(100vw - 2rem));
    padding: 2rem; border-radius: 14px;
    background: #131a26; border: 1px solid #232d3d;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 .35rem; font-size: 1.15rem; }
  p  { margin: 0 0 1.35rem; color: #93a3b8; font-size: .875rem; }
  label { display: block; margin-bottom: .4rem; font-size: .8rem; color: #93a3b8; }
  input {
    width: 100%; padding: .7rem .85rem; border-radius: 9px;
    border: 1px solid #2b3648;
    background: #0d131d; color: #e6edf7; font-size: .95rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  input:focus { outline: none; border-color: #4c8dff; box-shadow: 0 0 0 3px rgba(76,141,255,.18); }
  button {
    width: 100%; margin-top: 1rem; padding: .7rem; border: 0; border-radius: 9px;
    background: #4c8dff; color: #06101f; font-weight: 600; font-size: .95rem; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .error { margin-top: .9rem; min-height: 1.2em; font-size: .82rem; color: #ff7b72; }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <h1>Tripo Converter</h1>
    <p>This dashboard is private. Enter the access key to continue.</p>

    <label for="key">Access key</label>
    <input id="key" name="key" type="password" required autofocus spellcheck="false" />

    <button id="submit" type="submit">Unlock</button>
    <div class="error" id="error" role="alert"></div>
  </form>

<script>
  const form = document.getElementById('form');
  const keyInput = document.getElementById('key');
  const submit = document.getElementById('submit');
  const error = document.getElementById('error');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    error.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Checking…';

    try {
      const res = await fetch('/api/dashboard/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: keyInput.value })
      });
      if (!res.ok) throw new Error('That key was not accepted.');
      // The session cookie is set; go where the user was actually headed.
      const next = new URLSearchParams(location.search).get('next');
      location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : '/');
    } catch (err) {
      error.textContent = err.message;
      keyInput.select();
    } finally {
      submit.disabled = false;
      submit.textContent = 'Unlock';
    }
  });
</script>
</body>
</html>
