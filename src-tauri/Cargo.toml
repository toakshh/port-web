[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"

# Tuned for fast incremental rebuilds.
#
# Every build re-embeds the web assets, so the `app` crate is recompiled and
# relinked on every job - that link step is the single largest cost in a Fast
# build. These settings cut it from ~27s to ~8s on a warm cache.
#
# Fast and Clean deliberately share this one profile: Cargo keys its cache on
# profile settings, so giving Clean a different profile would invalidate the
# cache and make the *next* Fast build a full rebuild.
#
# The runtime cost is negligible here - this crate only hosts a system webview,
# which is where all the real work happens.
[profile.release]
opt-level = 1
codegen-units = 256
incremental = true
lto = false
panic = "abort"
strip = true
