<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bottom Base Polyline (3 Wall Segments) -->
    <polyline points="8,46 24,54 40,42 56,50" />

    <!-- Top Extruded Polyline -->
    <polyline points="8,20 24,28 40,16 56,24" />

    <!-- Vertical Extrusion Edges -->
    <line x1="8" y1="46" x2="8" y2="20" />
    <line x1="24" y1="54" x2="24" y2="28" />
    <line x1="40" y1="42" x2="40" y2="16" />
    <line x1="56" y1="50" x2="56" y2="24" />
  </g>

  <!-- Vertex Nodes -->
  <g fill="#ffffff">
    <circle cx="8" cy="46" r="1.5" />
    <circle cx="24" cy="54" r="1.5" />
    <circle cx="40" cy="42" r="1.5" />
    <circle cx="56" cy="50" r="1.5" />

    <circle cx="8" cy="20" r="1.5" />
    <circle cx="24" cy="28" r="1.5" />
    <circle cx="40" cy="16" r="1.5" />
    <circle cx="56" cy="24" r="1.5" />
  </g>
</svg>
