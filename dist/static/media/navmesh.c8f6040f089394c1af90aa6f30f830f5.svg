<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Navmesh Polygon Grid (Light Gray/White outline) -->
  <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer boundary of navigable mesh region -->
    <polygon points="12,48 8,28 24,14 48,12 56,26 52,48 30,54" stroke-width="2"/>

    <!-- Internal triangulation / polygonal decomposition -->
    <line x1="24" y1="14" x2="28" y2="32" />
    <line x1="48" y1="12" x2="28" y2="32" />
    <line x1="8" y1="28" x2="28" y2="32" />
    <line x1="12" y1="48" x2="28" y2="32" />
    <line x1="30" y1="54" x2="28" y2="32" />
    <line x1="52" y1="48" x2="28" y2="32" />
    <line x1="56" y1="26" x2="28" y2="32" />
    <line x1="28" y1="32" x2="42" y2="40" />
    <line x1="48" y1="12" x2="56" y2="26" stroke-dasharray="none" />
    <line x1="56" y1="26" x2="42" y2="40" />
    <line x1="52" y1="48" x2="42" y2="40" />
    <line x1="30" y1="54" x2="42" y2="40" />
  </g>

  <!-- Mesh Vertices -->
  <g fill="#ffffff">
    <circle cx="8" cy="28" r="1.5"/>
    <circle cx="24" cy="14" r="1.5"/>
    <circle cx="48" cy="12" r="1.5"/>
    <circle cx="56" cy="26" r="1.5"/>
    <circle cx="52" cy="48" r="1.5"/>
    <circle cx="30" cy="54" r="1.5"/>
    <circle cx="12" cy="48" r="1.5"/>
    <circle cx="28" cy="32" r="2"/>
    <circle cx="42" cy="40" r="1.5"/>
  </g>

  <!-- Navigation Waypoint / Path Indicator (Bold Accent Vertex & Waypoint Arrow) -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Path Line through nodes -->
    <path d="M 12 48 L 28 32 L 48 12" stroke-dasharray="2 2" stroke-width="1.5"/>
    <!-- Start Node -->
    <circle cx="12" cy="48" r="3" fill="#ffffff"/>
    <!-- Target Waypoint Pin -->
    <polygon points="48,6 52,14 44,14" fill="#ffffff" stroke="none"/>
  </g>
</svg>
