<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Google Sign-In Callback</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <script>
      (function () {
        var hash = window.location.hash ? window.location.hash.slice(1) : "";
        var params = new URLSearchParams(hash);
        var redirectParams = new URLSearchParams();
        var idToken = params.get("id_token");
        var state = params.get("state");
        var error = params.get("error");

        if (idToken) {
          redirectParams.set("google_id_token", idToken);
        }

        if (state) {
          redirectParams.set("google_state", state);
        }

        if (error) {
          redirectParams.set("google_error", error);
        }

        var target =
          window.location.origin + "/#/login" +
          (redirectParams.toString() ? "?" + redirectParams.toString() : "");

        window.location.replace(target);
      })();
    </script>
  </body>
</html>
